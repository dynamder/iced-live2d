[workspace]
resolver = "2"
members = ["crates/live2d-render", "crates/iced-live2d", "crates/iced-live2d-macros", "app"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.dependencies]
wgpu = "30"
# mocari 0.4.1 cannot draw this rig unpatched: `vendor/mocari` is the crates.io
# release plus every `patches/mocari-0.4.1-*.patch`. It is committed so a fresh
# clone resolves without a setup step; ./scripts/vendor-mocari.ps1 refreshes it.
mocari = { path = "vendor/mocari" }
