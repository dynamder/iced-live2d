[workspace]
resolver = "2"
members = ["crates/live2d-render", "crates/iced-live2d", "crates/iced-live2d-macros", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.dependencies]
wgpu = "30"
mocari = "0.4.1"

# mocari 0.4.1 cannot draw this rig unpatched. `.refs/mocari` is upstream 0.4.1
# plus every `patches/mocari-0.4.1-*.patch`; ./scripts/vendor-mocari.ps1 rebuilds
# it from the cargo registry.
[patch.crates-io]
mocari = { path = ".refs/mocari" }
