[workspace]
resolver = "2"
members = ["crates/live2d-render", "crates/iced-live2d", "crates/iced-live2d-macros", "app"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.dependencies]
wgpu = "30"
# mocari 0.4.1 cannot render this rig unpatched, so it is vendored until the fixes
# reach upstream: `vendor/mocari` is the crates.io release plus `patches/`.
mocari = { path = "vendor/mocari" }
